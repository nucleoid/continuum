name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: continuum
          POSTGRES_PASSWORD: continuum
          POSTGRES_DB: continuum
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U continuum -d continuum"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CONTINUUM_TEST_DATABASE_URL: postgres://continuum:continuum@localhost:5433/continuum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  windows:
    name: Windows build and entrypoint test
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run src/api/entrypoint.test.ts src/api/entrypoint-callers.test.ts
      - run: node scripts/windows-entrypoint-smoke.mjs
