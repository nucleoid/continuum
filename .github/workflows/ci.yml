name: CI

on:
  push:
    branches: [master, codex/feat/18-streamable-http]
  pull_request:

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=384

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: continuum
          POSTGRES_PASSWORD: continuum
          POSTGRES_DB: continuum
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U continuum -d continuum"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CONTINUUM_TEST_DATABASE_URL: postgres://continuum:continuum@localhost:5433/continuum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- --maxWorkers=1 --reporter=default --reporter=json --outputFile=test-results.json
      - name: Verify complete source test coverage
        if: always()
        run: node scripts/verify-ci-test-report.mjs
      - run: npm pack --dry-run
      - run: npm run smoke:cli-package
      - run: mkdir -p test-artifact && npm pack --ignore-scripts --pack-destination test-artifact
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: continuum-source-validation-${{ github.sha }}
          path: |
            test-results.json
            test-coverage.json
            test-artifact/*.tgz
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows build and entrypoint test
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run src/api/entrypoint.test.ts src/api/entrypoint-callers.test.ts
      - run: npx vitest run src/cli/config.test.ts src/cli/http.test.ts src/cli/index.test.ts
      - run: node scripts/windows-entrypoint-smoke.mjs
      - run: npm pack --dry-run
      - run: npm run smoke:cli-package
